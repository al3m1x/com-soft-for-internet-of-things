<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect x="0" y="0" width="1000" height="1000" fill="#fff"/>
  <text x="40" y="46" font-size="24">System Paczkomat</text>
  <g fill="#fff" stroke="#000" stroke-width="1.5"><polygon points="95,230 225,230 260,265 260,395 225,430 95,430 60,395 60,265"/><polygon points="435,230 565,230 600,265 600,395 565,430 435,430 400,395 400,265"/><polygon points="775,230 905,230 940,265 940,395 905,430 775,430 740,395 740,265"/></g>
  <g font-size="22" text-anchor="middle"><text x="160" y="338">KURIER</text><text x="500" y="338">PACZKOMAT</text><text x="840" y="338">ODBIORCA</text></g>
  <line x1="160" y1="70" x2="160" y2="228" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M40,100 H28 V136 H40 M133,100 H145 V136 H133" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="44" y="126" font-size="16">Nadanie</text>
  <g stroke="#000" stroke-width="1.5" fill="none"><line x1="262" y1="305" x2="398" y2="305" marker-end="url(#arr)"/><line x1="398" y1="355" x2="262" y2="355" marker-end="url(#arr)"/><line x1="602" y1="305" x2="738" y2="305" marker-end="url(#arr)"/><line x1="738" y1="355" x2="602" y2="355" marker-end="url(#arr)"/></g>
  <path d="M242,148 H230 V206 H242 M418,148 H430 V206 H418" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="246" y="174" font-size="16">Paczka(nr)</text>
  <text x="246" y="196" font-size="16">Zamknięto</text>
  <path d="M242,458 H230 V516 H242 M418,458 H430 V516 H418" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="246" y="484" font-size="16">Otwarto(sk)</text>
  <text x="246" y="506" font-size="16">Brak_miejsca</text>
  <path d="M582,104 H570 V206 H582 M758,104 H770 V206 H758" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="586" y="130" font-size="16">SMS(kod)</text>
  <text x="586" y="152" font-size="16">Otwarto(sk)</text>
  <text x="586" y="174" font-size="16">Błędny_kod</text>
  <text x="586" y="196" font-size="16">Blokada</text>
  <path d="M582,458 H570 V538 H582 M758,458 H770 V538 H758" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="586" y="484" font-size="16">Kod(kod)</text>
  <text x="586" y="506" font-size="16">Odebrano</text>
  <text x="586" y="528" font-size="16">Anuluj</text>
  <text x="40" y="630" font-size="18" font-weight="bold">Ograniczenia</text>
  <text x="40" y="660" font-size="16">• Kurier skanuje paczkę (Paczka), skrytka się otwiera, Kurier wkłada paczkę i ją zamyka (Zamknięto).</text>
  <text x="40" y="686" font-size="16">• Kod odbioru (kod) jest jednorazowy i wysyłany do Odbiorcy w SMS po zamknięciu skrytki przez Kuriera.</text>
  <text x="40" y="712" font-size="16">• Po 3 błędnych kodach Odbiorcy Paczkomat blokuje odbiór (Blokada) do upływu czasu T.</text>
  <text x="40" y="738" font-size="16">• Czas na odbiór T = 48 h od wysłania SMS, po upływie skrytka jest zwalniana.</text>
  <text x="40" y="764" font-size="16">• Rozmiar paczki (rozm ∈ {S, M, L}) wynika z jej numeru; brak wolnej skrytki tego rozmiaru → Brak_miejsca.</text>
  <text x="40" y="790" font-size="16">• nr – numer paczki, sk – numer skrytki, kod – kod odbioru.</text>
  </svg>